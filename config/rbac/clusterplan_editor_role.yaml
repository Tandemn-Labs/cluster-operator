# This rule is not used by the project cluster-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the planner.tandemn.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cluster-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusterplan-editor-role
rules:
- apiGroups:
  - planner.tandemn.com
  resources:
  - clusterplans
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - planner.tandemn.com
  resources:
  - clusterplans/status
  verbs:
  - get
